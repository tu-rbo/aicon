# GitHub Actions: linters and tests of the simulated examples (see docs/coding-standards.md).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      # robosuite's renderer imports libGL / libEGL even when nothing is rendered
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y libgl1 libegl1
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[test,dev,pusht,nav2d,robosuite,lint]"
      - run: ruff format --check $(git ls-files '*.py' ':!tools')
      - run: pylint $(git ls-files '*.py' ':!tools')
      - run: flake8 $(git ls-files '*.py' ':!tools')
      - run: pytest --durations=10 --maxfail=2
      # the linter in tools/aiconls: its own tests, then every example against its spec.yaml (without ROS, the
      # dynamic check skips the components that need it, with a warning)
      - run: pytest -q
        working-directory: tools/aiconls
      - run: |
          for spec in $(git ls-files 'examples/*spec.yaml'); do
            python tools/aiconls/src/aiconls.py scan "$(dirname "$spec")" --dynamic --fail-on error --color never || exit 1
          done
