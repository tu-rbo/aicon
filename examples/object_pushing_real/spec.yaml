# Graph of examples/object_pushing_real for the AICON linter (aiconls): the components with their quantities, the
# connections between them and the goals, as built by get_building_functions().
# Generated by `python -m examples.spec_files`; regenerate it after changing the graph.
#
components:
  ExternalForceEstimator:
    component_type: Estimator
    class_name: ExternalForceEstimator
    dtype: float64
    quantities:
      ee_force_external:
        shape: (3,)
  JointVelocities:
    component_type: Action
    class_name: JointVeloPandaControlViaROSCtrl
    dtype: float64
    quantities:
      action_velo_joints:
        shape: (7,)
  JointStateEstimator:
    component_type: Estimator
    class_name: JointStateEstimator
    dtype: float64
    quantities:
      robot_joint_states:
        shape: (7,)
  PostureEstimator:
    component_type: Estimator
    class_name: PostureEstimator
    dtype: float64
    goals: [PostureGoal]
    quantities:
      joint_range_utilization:
        shape: (7,)
  JointLimitEstimator:
    component_type: Estimator
    class_name: JointLimitEstimator
    dtype: float64
    goals: [JointLimitGoal]
    quantities:
      likelihood_joint_at_limit:
        shape: (7,)
      joint_close_to_limit:
        shape: (7,)
  EEPoseEstimator:
    component_type: Estimator
    class_name: AdaptedJointControlEEPoseEstimator
    dtype: float64
    quantities:
      pose_ee:
        q_type: Gaussian
        dim: 6
        uncertainty_name: uncertainty_ee
  BodyEstimator:
    component_type: Estimator
    class_name: BodyEstimator
    dtype: float64
    quantities:
      body_points:
        shape: (19, 3)
  ContactsEstimator:
    component_type: Estimator
    class_name: ContactsEstimator
    dtype: float64
    quantities:
      contactpoint_locations:
        shape: (8, 2)
      contact_likelihoods:
        shape: (8,)
      push_velocity_directions:
        shape: (8, 3)
  PusherEstimator:
    component_type: Estimator
    class_name: PusherEstimator
    dtype: float64
    quantities:
      pusher_point:
        shape: (2,)
      pusher_height:
        shape: (1,)
  ObjectEstimator:
    component_type: Estimator
    class_name: ObjectEstimator
    dtype: float64
    goals: [Push2Goal]
    quantities:
      object_position:
        shape: (3,)
      object_height:
        shape: (1,)
      object_uncertainty:
        shape: (1,)
  SelfCollisionEstimator:
    component_type: Estimator
    class_name: SelfCollisionEstimator
    dtype: float64
    goals: [SelfCollisionGoal]
    quantities:
      likelihood_self_collision:
        shape: (1,)
  TwoDimKeypointEstimator:
    component_type: Estimator
    class_name: TwoDimKeypointEstimator
    dtype: float32
    quantities:
      keypoint_locations:
        shape: (8, 2)
      keypoints_registered:
        shape: (8, 2)
  CorrectHeightEstimator:
    component_type: Estimator
    class_name: CorrectHeightEstimator
    dtype: float64
    goals: [GoalHeight]
    quantities:
      height_difference:
        shape: (1,)
  SingularityEstimator:
    component_type: Estimator
    class_name: SingularityEstimator
    dtype: float64
    goals: [SingularityGoal]
    quantities:
      likelihood_ee_singularity:
        shape: (1,)
  InteractionEstimator:
    component_type: Estimator
    class_name: InteractionEstimator
    dtype: float64
    quantities:
      interaction_likelihood:
        shape: (1,)
  ForceTorqueSensor:
    component_type: Sensor
    class_name: ForceTorqueSensor
    dtype: float64
    quantities:
      ee_force_measured:
        shape: (6,)
  JointStateSensor:
    component_type: Sensor
    class_name: RobotJointSensor
    dtype: float64
    quantities:
      robot_joint_states_meas:
        shape: (7,)
  ObjectPushingSensor:
    component_type: Sensor
    class_name: ObjectPushingSensor
    dtype: float64
    quantities:
      keypoints_in_CF:
        shape: (8, 3)
      keypoints_partial_in_CF:
        shape: (8, 3)
      keypoints_reject_cause:
        shape: (1,)
      keypoints_valid:
        shape: (8,)
      object_angle_meas:
        shape: (1,)

goals:
  PostureGoal:
    class_name: PostureGoal
  JointLimitGoal:
    class_name: JointLimitOnLikelihoodGoal
  Push2Goal:
    class_name: Push2GoalReal
  SelfCollisionGoal:
    class_name: SelfCollisionGoal
  GoalHeight:
    class_name: GoalHeight
  SingularityGoal:
    class_name: SingularityGoal

connections:
  OwnWeightCompensation:
    class_name: EEFTWithPusherConnection
    components: [ExternalForceEstimator, ForceTorqueSensor]
  LinearVelocityJoints:
    class_name: JointsVeloConnection
    components: [JointVelocities, JointStateEstimator]
  DirectMeasurementJoints:
    class_name: JointsProprioConnection
    components: [JointStateEstimator, JointStateSensor]
  RobotForwardKinematics:
    class_name: PandaJoint2EEConnection
    components: [JointStateEstimator, EEPoseEstimator]
  JointLimitLikelihoodConnection:
    class_name: JointLimitLikelihoodConnection
    components: [JointStateEstimator, JointLimitEstimator]
  PandaJoint2SingularityConnection:
    class_name: PandaJoint2SingularityConnection
    components: [JointStateEstimator, SingularityEstimator]
  JointRangeUtilization:
    class_name: JointRangeUtilizationConnection
    components: [JointStateEstimator, PostureEstimator]
  EE2Pusher:
    class_name: EE2Pusher
    components: [EEPoseEstimator, PusherEstimator]
  EE2PusherHeight:
    class_name: EE2PusherHeight
    components: [EEPoseEstimator, PusherEstimator]
  KeyPoint2ObjectUncertainty:
    class_name: KeyPoint2ObjectUncertainty
    components: [EEPoseEstimator, ObjectEstimator, TwoDimKeypointEstimator]
  TwoDimKeypointsFrom3D:
    class_name: TwoDimKeypointsFrom3D
    components: [EEPoseEstimator, TwoDimKeypointEstimator, ObjectPushingSensor]
  Keypoints2ObjectHeight:
    class_name: Keypoints2ObjectHeight
    components: [EEPoseEstimator, ObjectEstimator, TwoDimKeypointEstimator, ObjectPushingSensor]
  PandaJoint2BodyPoints:
    class_name: PandaWithPusherJoint2BodyPointsConnection
    components: [BodyEstimator]
  BodyPoints2SelfCollision:
    class_name: BodyPoints2SelfCollisionConnection
    components: [BodyEstimator, SelfCollisionEstimator]
  KeyPoints2ContactPointsReal:
    class_name: KeyPoints2ContactPointsReal
    components: [ContactsEstimator, TwoDimKeypointEstimator]
  ContactPoints2ContactLikelihoodReal:
    class_name: ContactPoints2ContactLikelihoodReal
    components: [ContactsEstimator]
  ContactPoints2PushVelocityDirectionsReal:
    class_name: ContactPoints2PushVelocityDirectionsReal
    components: [ContactsEstimator]
  HeightDifference:
    class_name: HeightDifference
    components: [PusherEstimator, ObjectEstimator, CorrectHeightEstimator]
  ObjectvsPush2Interactionlikelihood:
    class_name: ObjectvsPush2Interactionlikelihood
    components: [PusherEstimator, ObjectEstimator, InteractionEstimator]
  Contacts2ObjectPosition:
    class_name: Contacts2ObjectPosition
    components: [ObjectEstimator, InteractionEstimator]
  KeyPoints2PositionReal:
    class_name: KeyPoints2PositionReal
    components: [ObjectEstimator, TwoDimKeypointEstimator]
  PusherNonPenetration2ObjectPosition:
    class_name: PusherNonPenetration2ObjectPosition
    components: [ObjectEstimator, TwoDimKeypointEstimator]
