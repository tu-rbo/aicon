# Graph of examples/pusht for the AICON linter (aiconls): the components with their quantities, the
# connections between them and the goals, as built by get_building_functions().
# Generated by `python -m examples.spec_files`; regenerate it after changing the graph.
#
components:
  KeypointSensor:
    component_type: Sensor
    class_name: KeypointSensor
    dtype: float64
    quantities:
      keypoint_locations:
        shape: (8, 2)
  PusherSensor:
    component_type: Sensor
    class_name: PusherSensor
    dtype: float64
    quantities:
      pusher_point_meas:
        shape: (2,)
  COMSensor:
    component_type: Sensor
    class_name: COMSensor
    dtype: float64
    quantities:
      object_COM:
        shape: (2,)
  PusherAction:
    component_type: Action
    class_name: PusherAction
    dtype: float64
    quantities:
      pusher_point_action:
        shape: (2,)
  ContactsEstimator:
    component_type: Estimator
    class_name: ContactsEstimatorSim
    dtype: float64
    quantities:
      contactpoint_locations:
        shape: (8, 2)
      contact_likelihoods:
        shape: (8,)
      push_velocity_directions:
        shape: (8, 3)
  PusherEstimator:
    component_type: Estimator
    class_name: PusherEstimatorSim
    dtype: float64
    quantities:
      pusher_point:
        shape: (2,)
  ObjectEstimator:
    component_type: Estimator
    class_name: ObjectEstimatorSim
    dtype: float64
    goals: [Push2Goal]
    quantities:
      object_position:
        shape: (3,)
  InteractionEstimatorSim:
    component_type: Estimator
    class_name: InteractionEstimatorSim
    dtype: float64
    quantities:
      interaction_likelihood:
        shape: (1,)

goals:
  Push2Goal:
    class_name: Push2GoalSim

connections:
  KeyPoints2Position:
    class_name: KeyPoints2Position
    components: [KeypointSensor, ObjectEstimator]
  KeyPoints2ContactPoints:
    class_name: KeyPoints2ContactPoints
    components: [KeypointSensor, ContactsEstimator, PusherEstimator]
  ContactPoints2PushVelocityDirections:
    class_name: ContactPoints2PushVelocityDirections
    components: [KeypointSensor, COMSensor, ContactsEstimator]
  PusherPointMeasurement:
    class_name: PusherPointMeasurement
    components: [PusherSensor, PusherEstimator]
  PusherPointAction:
    class_name: PusherPointAction
    components: [PusherAction, PusherEstimator]
  ContactPoints2ContactLikelihood:
    class_name: ContactPoints2ContactLikelihood
    components: [ContactsEstimator, PusherEstimator]
  Contacts2ObjectPosition:
    class_name: Contacts2ObjectPosition
    components: [ContactsEstimator, ObjectEstimator]
  ObjectvsPush2InteractionlikelihoodSim:
    class_name: ObjectvsPush2InteractionlikelihoodSim
    components: [PusherEstimator, ObjectEstimator, InteractionEstimatorSim]
