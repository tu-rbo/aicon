# Graph of examples/nav_2d for the AICON linter (aiconls): the components with their quantities, the
# connections between them and the goals, as built by get_building_functions().
# Generated by `python -m examples.spec_files`; regenerate it after changing the graph.
#
components:
  NavActionComp:
    component_type: Action
    class_name: NavActionComp
    dtype: float64
    quantities:
      action:
        shape: (2,)
  NavAgentSensor:
    component_type: Sensor
    class_name: NavAgentSensor
    dtype: float64
    quantities:
      agent_meas:
        shape: (2,)
  NavTargetSensor:
    component_type: Sensor
    class_name: NavTargetSensor
    dtype: float64
    quantities:
      target_meas:
        shape: (1,)
  ObstacleImageSensor:
    component_type: Sensor
    class_name: ObstacleImageSensor
    dtype: float64
    quantities:
      obstacle_image:
        shape: (30, 30)
  AgentEstimator:
    component_type: Estimator
    class_name: AgentEstimator
    dtype: float64
    quantities:
      agent_pos:
        shape: (2,)
  TargetEstimator:
    component_type: Estimator
    class_name: TargetEstimator
    dtype: float64
    goals: [TargetGoal]
    quantities:
      target_pos:
        q_type: Gaussian
        dim: 2
        uncertainty_name: target_uncertainty
      target_dist:
        shape: (1,)
  DistToObsEstimator:
    component_type: Estimator
    class_name: DistToObsEstimator
    dtype: float64
    goals: [ObstacleGoal]
    quantities:
      current_dist2obs:
        shape: (1,)

goals:
  TargetGoal:
    class_name: TargetGoal
  ObstacleGoal:
    class_name: ObstacleGoal

connections:
  NavAction:
    class_name: NavAction
    components: [NavActionComp, AgentEstimator]
  NavMeasurement:
    class_name: NavMeasurement
    components: [NavAgentSensor, AgentEstimator]
  NavTargetMeasurement:
    class_name: NavTargetMeasurement
    components: [NavTargetSensor, AgentEstimator, TargetEstimator]
  ObstacleDistConnection:
    class_name: ObstacleDistConnection
    components: [ObstacleImageSensor, AgentEstimator, DistToObsEstimator]
  TargetDistConnection:
    class_name: TargetDistConnection
    components: [AgentEstimator, TargetEstimator]
