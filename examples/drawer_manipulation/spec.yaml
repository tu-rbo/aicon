# Graph of examples/drawer_manipulation for the AICON linter (aiconls): the components with their quantities, the
# connections between them and the goals, as built by get_basic_building_functions_joint_level().
# Generated by `python -m examples.spec_files`; regenerate it after changing the graph.
#
# Not listed, as a spec has no component type for them: Visualizer (DrawerExperimentVisualizer).
components:
  ExternalForceEstimator:
    component_type: Estimator
    class_name: ExternalForceEstimator
    dtype: float64
    quantities:
      ee_force_external:
        shape: (3,)
  JointVelocities:
    component_type: Action
    class_name: JointVeloPandaControlViaROSCtrl
    dtype: float64
    quantities:
      action_velo_joints:
        shape: (7,)
  SimpleHandSynergyAction:
    component_type: Action
    class_name: SimpleHandSynergyAction
    dtype: float64
    quantities:
      hand_synergy_activation:
        shape: (1,)
  JointStateEstimator:
    component_type: Estimator
    class_name: JointStateEstimator
    dtype: float64
    goals: [JointLimitGoal]
    quantities:
      robot_joint_states:
        shape: (7,)
  EEPoseEstimator:
    component_type: Estimator
    class_name: JointControlEEPoseEstimator
    dtype: float64
    quantities:
      pose_ee:
        q_type: Gaussian
        dim: 6
        uncertainty_name: uncertainty_ee
  DrawerPosEstimator:
    component_type: Estimator
    class_name: DrawerPositionEstimator
    dtype: float64
    goals: [ReduceDistToPoint]
    quantities:
      position_drawer:
        q_type: Gaussian
        dim: 3
        uncertainty_name: uncertainty_drawer
  DistanceEstimator:
    component_type: Estimator
    class_name: DistEEDrawerEstimator
    dtype: float64
    quantities:
      distance_ee_drawer:
        shape: (2,)
      uncertainty_dist:
        shape: (1,)
  GraspLikelihoodEstimator:
    component_type: Estimator
    class_name: GraspedEstimator
    dtype: float64
    quantities:
      likelihood_grasped_drawer:
        shape: (1,)
      time_since_hand_change:
        shape: (2,)
  VisibleLikelihoodEstimator:
    component_type: Estimator
    class_name: VisibleEstimator
    dtype: float64
    quantities:
      likelihood_visible_drawer:
        shape: (1,)
  OcclusionAndObstaclePointsEstimator:
    component_type: Estimator
    class_name: OcclusionAndObstaclePointsEstimator
    dtype: float64
    quantities:
      obstacle_points:
        shape: (50, 3)
  BodyEstimator:
    component_type: Estimator
    class_name: BodyEstimator
    dtype: float64
    quantities:
      body_points:
        shape: (19, 3)
  SelfCollisionEstimator:
    component_type: Estimator
    class_name: SelfCollisionEstimator
    dtype: float64
    goals: [SelfCollisionGoal]
    quantities:
      likelihood_self_collision:
        shape: (1,)
  ObstacleCollisionEstimator:
    component_type: Estimator
    class_name: ObstacleCollisionEstimator
    dtype: float64
    goals: [ObstacleAvoidanceGoal]
    quantities:
      likelihood_obstacle_collision:
        shape: (50, 19)
  EnvironmentPointEstimator:
    component_type: Estimator
    class_name: EnvironmentPointEstimator
    dtype: float64
    quantities:
      environment_point_positions:
        shape: (0, 3)
      environment_point_uncertainties:
        shape: (0, 3, 3)
      environment_point_tracked:
        shape: (0,)
      environment_point_time_since_last_update:
        shape: (0,)
      environment_point_tracked_time_total:
        shape: (0,)
  CameraPointsSensor:
    component_type: Sensor
    class_name: CameraPointTracking
    dtype: float64
    quantities:
      relative_position_in_CF_environment_points:
        shape: (-1,)
      present_measurement_points_mask:
        shape: (-1,)
      depth_in_CF_environment_points:
        shape: (-1,)
      relative_position_in_CF_drawer:
        shape: (3,)
      depth_in_CF_drawer:
        shape: (1,)
      all_depth_values:
        shape: (1,)
  CameraDrawerPositionSensor:
    component_type: Sensor
    class_name: DLObjectInCameraSensor
    dtype: float64
    quantities:
      coarse_bounding_box_drawer:
        shape: (-1,)
  ForceTorqueSensor:
    component_type: Sensor
    class_name: ForceTorqueSensor
    dtype: float64
    quantities:
      ee_force_measured:
        shape: (6,)
  JointStateSensor:
    component_type: Sensor
    class_name: RobotJointSensor
    dtype: float64
    quantities:
      robot_joint_states_meas:
        shape: (7,)

goals:
  JointLimitGoal:
    class_name: JointLimitOnStateGoal
  ReduceDistToPoint:
    class_name: DrawerOpenGoal
  SelfCollisionGoal:
    class_name: SelfCollisionGoal
  ObstacleAvoidanceGoal:
    class_name: ObstacleAvoidanceGoal

connections:
  OwnWeightCompensation:
    class_name: EEFTWithHandConnection
    components: [ExternalForceEstimator, ForceTorqueSensor]
  LinearVelocityJoints:
    class_name: JointsVeloConnection
    components: [JointVelocities, JointStateEstimator]
  GraspedLikelihood:
    class_name: DistGraspHandConnection
    components: [SimpleHandSynergyAction, DistanceEstimator, GraspLikelihoodEstimator]
  DirectMeasurementJoints:
    class_name: JointsProprioConnection
    components: [JointStateEstimator, JointStateSensor]
  RobotForwardKinematics:
    class_name: PandaJoint2EEConnection
    components: [JointStateEstimator, EEPoseEstimator]
  ProjectiveGeometry:
    class_name: CameraAndPointsConnection
    components: [EEPoseEstimator, DrawerPosEstimator, CameraPointsSensor, CameraDrawerPositionSensor]
  "E[dist]":
    class_name: DistDrawerEEConnection
    components: [EEPoseEstimator, DrawerPosEstimator, DistanceEstimator]
  GraspedDrawerKinematics:
    class_name: EEDrawerGraspedConnection
    components: [EEPoseEstimator, DrawerPosEstimator, GraspLikelihoodEstimator]
  DepthCameraProjection:
    class_name: DepthCameraConnection
    components: [DrawerPosEstimator]
  VisibleLikelihood:
    class_name: VisibleEEDrawerConnection
    components: [VisibleLikelihoodEstimator]
  ObstacleCollision:
    class_name: ObstacleCollisionConnection
    components: [OcclusionAndObstaclePointsEstimator, BodyEstimator, ObstacleCollisionEstimator]
  Environment2ObstacleConnection:
    class_name: Environment2ObstacleConnection
    components: [OcclusionAndObstaclePointsEstimator]
  PandaJoint2BodyPoints:
    class_name: PandaWithHandJoint2BodyPointsConnection
    components: [BodyEstimator]
  BodyPoints2SelfCollision:
    class_name: BodyPoints2SelfCollisionConnection
    components: [BodyEstimator, SelfCollisionEstimator]
  ProjectiveGeometryEnvironment:
    class_name: CameraAndPointsConnection
    components: [EnvironmentPointEstimator]
