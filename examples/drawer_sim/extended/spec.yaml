# Graph of examples/drawer_sim/extended for the AICON linter (aiconls): the components with their quantities, the
# connections between them and the goals, as built by get_building_functions().
# With --no-triangulation, DrawerPosSensor and the DrawerDirectMeasurement connection replace BearingSensor
# and the camera connections ProjectiveGeometry and VisibleLikelihood.
# Generated by `python -m examples.spec_files`; regenerate it after changing the graph.
#
components:
  GripperAction:
    component_type: Action
    class_name: GripperAction
    dtype: float64
    quantities:
      gripper_activation:
        shape: (1,)
  EEForceSensor:
    component_type: Sensor
    class_name: EEForceSensor
    dtype: float64
    quantities:
      ee_force_mag_meas:
        shape: (1,)
  EEPosSensor:
    component_type: Sensor
    class_name: EEPoseSensor
    dtype: float64
    quantities:
      ee_pos_meas:
        shape: (6,)
  BearingSensor:
    component_type: Sensor
    class_name: BearingSensor
    dtype: float64
    quantities:
      relative_position_in_CF_drawer:
        shape: (3,)
  EEVelocities:
    component_type: Action
    class_name: VeloEEAction
    dtype: float64
    quantities:
      action_velo_ee:
        shape: (3,)
  EEPoseEstimator:
    component_type: Estimator
    class_name: EEPoseEstimator
    dtype: float64
    quantities:
      pose_ee:
        q_type: Gaussian
        dim: 6
        uncertainty_name: uncertainty_ee
  DrawerPosEstimator:
    component_type: Estimator
    class_name: DrawerPositionEstimator
    dtype: float64
    quantities:
      position_drawer:
        q_type: Gaussian
        dim: 3
        uncertainty_name: uncertainty_drawer
  DistanceEstimator:
    component_type: Estimator
    class_name: DistEEDrawerEstimator
    dtype: float64
    quantities:
      distance_ee_drawer:
        shape: (2,)
      uncertainty_dist:
        shape: (1,)
  GraspLikelihoodEstimator:
    component_type: Estimator
    class_name: GraspedEstimator
    dtype: float64
    quantities:
      likelihood_grasped_drawer:
        shape: (1,)
      time_since_hand_change:
        shape: (2,)
  VisibleEstimator:
    component_type: Estimator
    class_name: VisibleEstimator
    dtype: float64
    quantities:
      likelihood_visible_drawer:
        shape: (1,)
  KinematicJointEstimator:
    component_type: Estimator
    class_name: KinematicJointEstimator
    dtype: float64
    goals: [ReduceJointStateDifference]
    quantities:
      kinematic_joint:
        q_type: Gaussian
        dim: 6
        uncertainty_name: uncertainty_joint

goals:
  ReduceJointStateDifference:
    class_name: DrawerOpenViaJointGoal

connections:
  GraspedLikelihood:
    class_name: DistGraspHandConnection
    components: [GripperAction, EEForceSensor, DistanceEstimator, GraspLikelihoodEstimator]
  DirectMeasurement:
    class_name: EEProprioConnection
    components: [EEPosSensor, EEPoseEstimator]
  ProjectiveGeometry:
    class_name: DrawerCameraEEConnection
    components: [BearingSensor, EEPoseEstimator, DrawerPosEstimator, VisibleEstimator]
  ForwardKinematics:
    class_name: EEVeloConnection
    components: [EEVelocities, EEPoseEstimator]
  GraspedDrawerKinematics:
    class_name: EEDrawerGraspedConnection
    components: [EEPoseEstimator, DrawerPosEstimator, GraspLikelihoodEstimator]
  "E[dist]":
    class_name: DistDrawerEEConnection
    components: [EEPoseEstimator, DrawerPosEstimator, DistanceEstimator]
  VisibleLikelihood:
    class_name: VisibleEEDrawerConnection
    components: [EEPoseEstimator, DrawerPosEstimator, VisibleEstimator]
  DrawerKinematics:
    class_name: KinematicJointConnection
    components: [DrawerPosEstimator, GraspLikelihoodEstimator, KinematicJointEstimator]
