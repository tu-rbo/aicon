# Graph of examples/blocksworld for the AICON linter (aiconls): the components with their quantities, the
# connections between them and the goals, as built by get_building_functions_basic_blocks_world().
# The goal is chosen on the command line: the default StackAonB is attached, the others are listed.
# Generated by `python -m examples.spec_files`; regenerate it after changing the graph.
#
components:
  BlocksBelowSensor:
    component_type: Sensor
    class_name: BlocksBelowSensor
    dtype: float64
    quantities:
      below_state_sensed:
        shape: (10, 10)
  BelowEstimator:
    component_type: Estimator
    class_name: BelowEstimator
    dtype: float64
    goals: [StackAonB]
    quantities:
      likelihood_below:
        shape: (10, 10)
  ClearEstimator:
    component_type: Estimator
    class_name: ClearEstimator
    dtype: float64
    quantities:
      likelihood_clear:
        shape: (10,)
  BlockPuttingAction:
    component_type: Action
    class_name: BlockPuttingAction
    dtype: float64
    quantities:
      action_blocks:
        shape: (2, 10, 10)

goals:
  StackAonB:
    class_name: StackAonBGoal
  UnstackAll:
    class_name: UnstackAllGoal
  SmartStackAonBonC:
    class_name: SmartStackAonBonC
  UnstackAonB:
    class_name: UnstackAonBGoal
  StackAonBonC:
    class_name: StackAonBonCGoal

connections:
  BelowLikelihoodDummySensing:
    class_name: BelowLikelihoodDummySensing
    components: [BlocksBelowSensor, BelowEstimator, BlockPuttingAction]
  ClearLikelihood:
    class_name: ClearLikelihood
    components: [BelowEstimator, ClearEstimator]
  BelowLikelihood:
    class_name: BelowLikelihood
    components: [BelowEstimator, ClearEstimator, BlockPuttingAction]
